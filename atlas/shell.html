<title>螺壳系统文档</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: an engineering atlas — fixed index rail on the left, one sheet at a time on the right, every fact tagged with how sure we are. */
:root{
  --paper:#f4f6f5; --sheet:#fbfcfb; --ink:#16212a; --muted:#5b6872; --rule:#d5dcda;
  --shell:#2d6a6e; --shell-soft:#dbe9e8; --warn:#9a5b00; --warn-soft:#f6e8cf; --bad:#a3322b; --bad-soft:#f5dcd9; --ok:#2f6b3a; --ok-soft:#dcebdd;
  --f-display:"Noto Serif SC","Songti SC",serif; --f-body:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111719; --sheet:#161e21; --ink:#e3eaea; --muted:#9aa8ad; --rule:#2b3639;
  --shell:#7fbdbf; --shell-soft:#1f3436; --warn:#e2b25e; --warn-soft:#3a2d16; --bad:#ec8a80; --bad-soft:#3d1f1c; --ok:#8fcf98; --ok-soft:#1d3220; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111719; --sheet:#161e21; --ink:#e3eaea; --muted:#9aa8ad; --rule:#2b3639;
  --shell:#7fbdbf; --shell-soft:#1f3436; --warn:#e2b25e; --warn-soft:#3a2d16; --bad:#ec8a80; --bad-soft:#3d1f1c; --ok:#8fcf98; --ok-soft:#1d3220; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow:auto;border-right:1px solid var(--rule);padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.02em}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.06em;margin-top:2px}
.navgroup{margin-top:20px;display:flex;flex-direction:column;gap:2px}
.navlabel{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
nav.rail a{color:var(--ink);text-decoration:none;padding:4px 8px;border-radius:4px;font-size:14px}
nav.rail a:hover{background:var(--shell-soft)}
nav.rail a.on{background:var(--shell);color:var(--sheet)}
.picker{display:none}
main{padding-block:32px 64px;padding-left:max(16px,4vw);padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:820px}
.page:not(.show){display:none}
h1{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.25;margin:0 0 6px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:36px 0 8px;padding-top:12px;border-top:1px solid var(--rule);text-wrap:balance}
h3{font-size:15px;margin:22px 0 6px}
.lede{color:var(--muted);margin:0 0 20px;max-width:65ch}
p,li{max-width:70ch}
code,.mono{font-family:var(--f-mono);font-size:.88em}
code{background:var(--shell-soft);padding:1px 5px;border-radius:3px}
a{color:var(--shell)}
.tbl{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;font-size:13.5px;min-width:520px}
th,td{border-bottom:1px solid var(--rule);padding:6px 10px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12.5px}
.chip{display:inline-block;font-size:11px;line-height:1.6;padding:0 7px;border-radius:3px;font-family:var(--f-mono);white-space:nowrap;vertical-align:1px}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-check{background:var(--warn-soft);color:var(--warn)} .c-bad{background:var(--bad-soft);color:var(--bad)} .c-info{background:var(--shell-soft);color:var(--shell)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin:8px 0 18px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:14px 0}
.fact{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;min-width:0}
.fact b{display:block;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.note{background:var(--sheet);border-left:3px solid var(--warn);padding:8px 12px;margin:12px 0;font-size:14px}
.src{font-size:12px;color:var(--muted)}
pre.mermaid{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px;overflow-x:auto}
footer{margin-top:48px;font-size:12px;color:var(--muted)}
@media (max-width:760px){
  .wrap{grid-template-columns:1fr}
  nav.rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule);padding-right:max(16px,env(safe-area-inset-right,0px))}
  .navgroup{display:none}
  .picker{display:block;margin-top:12px;width:100%;font:inherit;padding:6px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  h1{font-size:25px}
}
:focus-visible{outline:2px solid var(--shell);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<div class="wrap">
<nav class="rail" aria-label="目录">
  <div class="brand">螺壳系统文档<small>LUOKE DOCS · 生成于 {{BUILT}}</small></div>
  <label class="picker-label" for="pagepicker" hidden>页面</label>
  <select class="picker" id="pagepicker">{{OPTIONS}}</select>
  {{NAV}}
</nav>
<main>
{{PAGES}}
<footer>内容按代码核对；修订见"文档修订"。</footer>
</main>
</div>
<script>
(function(){
  var pages=[].slice.call(document.querySelectorAll('.page'));
  var links=[].slice.call(document.querySelectorAll('nav.rail a[data-page]'));
  var picker=document.getElementById('pagepicker');
  function show(id){
    var found=pages.some(function(p){return p.id===id}); if(!found) id=pages[0].id;
    pages.forEach(function(p){p.classList.toggle('show',p.id===id)});
    links.forEach(function(a){a.classList.toggle('on',a.dataset.page===id)});
    picker.value=id; window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',function(){show(location.hash.slice(1))});
  picker.addEventListener('change',function(){location.hash=picker.value});
  show(location.hash.slice(1));
  if(!window.claude && document.querySelector('pre.mermaid')){
    var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js';
    s.onload=function(){try{mermaid.initialize({startOnLoad:false,theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'neutral'});mermaid.run()}catch(e){}};
    document.head.appendChild(s);
  }
})();
</script>
